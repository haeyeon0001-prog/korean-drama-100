<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#F2F5F4"><meta name="robots" content="noindex,nofollow,noarchive"><title>韓国語 ドラマ編 文型100 · 復習</title><link rel="stylesheet" href="style.css"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"></head>
<body><header class="bar"><div class="wrap"><a class="brand" href="#home">韓国語 ドラマ編 <small>文型100</small></a><nav aria-label="アプリ操作"><span id="progTxt" class="prog-txt">0 / 100</span><a class="btn small ghost" href="#review">復習 <span id="wrongCount">0</span></a><button class="btn small ghost" data-act="settings">設定</button></nav></div><div class="progress"><i id="progBar"></i></div></header>
<main id="app" class="wrap" tabindex="-1"><section class="card" role="status"><h1>教材を読み込んでいます</h1></section></main>
<dialog id="settings" class="panel"><h2>表示と学習記録</h2><div class="field"><label for="theme">画面の色</label><select id="theme"><option value="auto">端末に合わせる</option><option value="light">明るい</option><option value="dark">暗い</option></select></div><p>回答・間違い・文型の復習済みチェック・メモを、このブラウザに保存します。</p><div class="field"><b>オフライン保存</b><p id="offlineStatus" role="status">確認中</p><button class="btn" data-act="offline-retry">保存を再試行</button><button class="btn" data-act="offline-status">保存状況を確認</button></div><div class="panel-actions"><button class="btn" data-act="export">学習記録を書き出す</button><button class="btn" data-act="import">学習記録を読み込む</button><input id="importProgress" type="file" accept="application/json,.json" hidden><button class="btn danger" data-act="reset">この教材の記録をリセット</button><button class="btn primary" data-act="close-settings">閉じる</button></div></dialog>
<div id="toast" class="toast" role="status" hidden></div>
<script>window.addEventListener('load',()=>{if(!window.APP_READY){document.getElementById('app').innerHTML='<section class="card" role="alert"><h1>教材を読み込めませんでした</h1><p>通信を確認して、再読み込みしてください。改善しない場合は、本書に掲載されたURLからもう一度開いてください。</p><button class="btn" onclick="location.reload()">再読み込み</button></section>';}});</script><script src="data.js"></script><script src="app.js"></script></body></html>
